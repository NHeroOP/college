<head>
    <meta charset="UTF-8">

    <link rel="stylesheet" href="style.css">
</head>
<body>
<header>
    <div class="header-content">
        <img src="images/logo.svg" alt="College Logo" class="logo">
        <div class="college-name">
            <h1>Govt. College of Engineering & Technology, Jammu</h1>
            <p>Knowledge • Innovation • Excellence</p>
        </div>
    </div>
</header>

<nav>
    <div class="navbar">
        <a href="index.html">Home</a>
        <a href="about.html">About</a>

        <a href="gallery.html">Photo Gallery</a>
        <a href="admission.html">Admission Form</a>
    </div>
</nav>
<main>
<section class="section">
    <h2>Student Admission Form</h2>

    <div class="form-box">
        <form>
            <div class="form-row">
                <div class="form-group">
                    <label for="name">Full Name</label>
                    <input type="text" id="name" name="name" placeholder="Enter your name" required>
                </div>

                <div class="form-group">
                    <label for="dob">Date of Birth</label>
                    <input type="date" id="dob" name="dob" required>
                </div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" placeholder="Enter your email" required>
                </div>

                <div class="form-group">
                    <label for="mobile">Mobile Number</label>
                    <input type="tel" id="mobile" name="mobile" placeholder="Enter mobile number" required>
                </div>
            </div>

            <div class="form-group radio-group">
                <label>Gender</label>
                <label><input type="radio" name="gender" value="male"> Male</label>
                <label><input type="radio" name="gender" value="female"> Female</label>
                <label><input type="radio" name="gender" value="other"> Other</label>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label for="course">Course</label>
                    <select id="course" name="course">
                        <option value="">-- Select Course --</option>
                        <option>Computer Science Engineering</option>
                        <option>Electronics Engineering</option>
                        <option>Mechanical Engineering</option>
                        <option>Civil Engineering</option>
                        <option>Electrical Engineering</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="hobbies">Hobbies</label>
                    <input type="text" id="hobbies" name="hobbies" placeholder="Reading, sports, music">
                </div>
            </div>

            <div class="form-group">
                <label for="address">Address</label>
                <textarea id="address" name="address" placeholder="Enter your address"></textarea>
            </div>

            <div class="form-buttons">
                <button type="submit">Submit</button>
                <button type="reset">Reset</button>
            </div>
        </form>
    </div>
</section>
</main>

</html>
